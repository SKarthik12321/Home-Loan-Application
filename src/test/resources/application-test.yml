spring:
  datasource:
    url: jdbc:h2:mem:homeloan;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  loan:
    default-annual-rate: 8.5
  security:
    jwt:
      secret: "01234567890123456789012345678901"
      expiration-ms: 3600000
